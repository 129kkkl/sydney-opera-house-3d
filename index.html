<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>悉尼歌剧院 · Sydney Opera House — Three.js 交互场景</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b1622;
        font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #eaf2f8;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
      }

      /* ---------- 加载页 ---------- */
      #loader {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: linear-gradient(160deg, #0d2033 0%, #123449 55%, #0b1622 100%);
        transition: opacity 0.9s ease, visibility 0.9s ease;
      }
      #loader.hidden {
        opacity: 0;
        visibility: hidden;
      }
      .loader-title {
        font-size: 22px;
        letter-spacing: 6px;
        font-weight: 300;
        opacity: 0.92;
      }
      .loader-sub {
        font-size: 12px;
        letter-spacing: 3px;
        opacity: 0.55;
      }
      .loader-bar {
        width: 240px;
        height: 2px;
        background: rgba(255, 255, 255, 0.16);
        overflow: hidden;
        border-radius: 2px;
      }
      .loader-bar > i {
        display: block;
        height: 100%;
        width: 40%;
        background: #ffd9a0;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(280%); }
      }

      /* ---------- 顶部标题 ---------- */
      #title {
        position: fixed;
        top: 22px;
        left: 26px;
        z-index: 20;
        pointer-events: none;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55);
      }
      #title h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 500;
        letter-spacing: 4px;
      }
      #title p {
        margin: 6px 0 0;
        font-size: 11px;
        letter-spacing: 2.4px;
        opacity: 0.72;
      }

      /* ---------- 控制面板 ---------- */
      #panel {
        position: fixed;
        right: 22px;
        top: 22px;
        z-index: 20;
        width: 232px;
        padding: 16px 16px 14px;
        border-radius: 14px;
        background: rgba(12, 24, 36, 0.55);
        backdrop-filter: blur(14px) saturate(1.2);
        -webkit-backdrop-filter: blur(14px) saturate(1.2);
        border: 1px solid rgba(255, 255, 255, 0.13);
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
        transition: transform 0.35s ease, opacity 0.35s ease;
      }
      #panel.collapsed {
        transform: translateX(calc(100% + 30px));
        opacity: 0;
        pointer-events: none;
      }
      .panel-section {
        margin-bottom: 13px;
      }
      .panel-section:last-child {
        margin-bottom: 0;
      }
      .panel-label {
        font-size: 10px;
        letter-spacing: 2.2px;
        opacity: 0.62;
        margin-bottom: 8px;
        text-transform: uppercase;
      }
      .btn-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }
      button {
        font-family: inherit;
        color: #eaf2f8;
        background: rgba(255, 255, 255, 0.09);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 9px;
        padding: 8px 6px;
        font-size: 11.5px;
        letter-spacing: 1.2px;
        cursor: pointer;
        transition: background 0.2s ease, border-color 0.2s ease, transform 0.12s ease;
      }
      button:hover {
        background: rgba(255, 217, 160, 0.22);
        border-color: rgba(255, 217, 160, 0.5);
      }
      button:active {
        transform: scale(0.96);
      }
      button.active {
        background: rgba(255, 217, 160, 0.32);
        border-color: rgba(255, 217, 160, 0.75);
      }
      button.wide {
        grid-column: span 2;
      }

      .slider-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      input[type='range'] {
        flex: 1;
        -webkit-appearance: none;
        appearance: none;
        height: 3px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.22);
        outline: none;
      }
      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #ffd9a0;
        cursor: pointer;
        border: 2px solid rgba(0, 0, 0, 0.25);
      }
      .slider-value {
        font-size: 11px;
        width: 42px;
        text-align: right;
        opacity: 0.85;
        font-variant-numeric: tabular-nums;
      }

      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 2px;
        font-size: 11.5px;
        letter-spacing: 1px;
      }
      .switch {
        position: relative;
        width: 34px;
        height: 18px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.18);
        cursor: pointer;
        transition: background 0.25s ease;
      }
      .switch::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #f2f6fa;
        transition: transform 0.25s ease;
      }
      .switch.on {
        background: rgba(255, 217, 160, 0.8);
      }
      .switch.on::after {
        transform: translateX(16px);
      }

      /* ---------- 提示 ---------- */
      #hint {
        position: fixed;
        left: 26px;
        bottom: 22px;
        z-index: 20;
        font-size: 10.5px;
        letter-spacing: 1.6px;
        line-height: 1.9;
        opacity: 0.62;
        pointer-events: none;
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.6);
      }
      #panel-toggle {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 21;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        font-size: 17px;
        padding: 0;
        background: rgba(12, 24, 36, 0.6);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      /* ---------- 建筑标注 ---------- */
      .label-3d {
        pointer-events: none;
        white-space: nowrap;
        transform: translate(-50%, -50%);
        transition: opacity 0.35s ease;
      }
      .label-3d .tag {
        display: inline-block;
        padding: 5px 11px;
        border-radius: 20px;
        font-size: 10.5px;
        letter-spacing: 1.6px;
        color: #f3f8fc;
        background: rgba(10, 22, 34, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.22);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }
      .label-3d .dot {
        display: block;
        width: 6px;
        height: 6px;
        margin: 5px auto 0;
        border-radius: 50%;
        background: #ffd9a0;
        box-shadow: 0 0 10px rgba(255, 217, 160, 0.9);
      }

      #credit {
        position: fixed;
        right: 24px;
        bottom: 76px;
        z-index: 19;
        font-size: 9.5px;
        letter-spacing: 2px;
        opacity: 0.42;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="loader">
      <div class="loader-title">悉 尼 歌 剧 院</div>
      <div class="loader-sub">SYDNEY OPERA HOUSE · THREE.JS</div>
      <div class="loader-bar"><i></i></div>
    </div>

    <div id="title">
      <h1>悉尼歌剧院</h1>
      <p>SYDNEY OPERA HOUSE · BENNELONG POINT</p>
    </div>

    <div id="panel">
      <div class="panel-section">
        <div class="panel-label">观察机位 / viewpoints</div>
        <div class="btn-grid" id="view-buttons">
          <button data-view="default">默认全景</button>
          <button data-view="front">正面临港</button>
          <button data-view="side">侧面序列</button>
          <button data-view="high">高位俯瞰</button>
          <button data-view="water">水面低角度</button>
          <button data-view="steps">台阶近景</button>
          <button data-view="top">屋顶鸟瞰</button>
          <button data-view="night">夜景灯光</button>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-label">时间 / time of day</div>
        <div class="slider-row">
          <input id="time-slider" type="range" min="5" max="24" step="0.1" value="15.5" />
          <div class="slider-value" id="time-value">15:30</div>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-label">显示 / display</div>
        <div class="toggle-row">
          <span>自动环绕</span>
          <div class="switch" id="toggle-rotate"></div>
        </div>
        <div class="toggle-row">
          <span>镜头导览</span>
          <div class="switch" id="toggle-tour"></div>
        </div>
        <div class="toggle-row">
          <span>建筑标注</span>
          <div class="switch" id="toggle-labels"></div>
        </div>
        <div class="toggle-row">
          <span>水面动画</span>
          <div class="switch on" id="toggle-water"></div>
        </div>
      </div>

      <div class="panel-section">
        <div class="btn-grid">
          <button data-view="default" class="wide">恢复默认视角 (R)</button>
        </div>
      </div>
    </div>

    <div id="hint">
      左键拖动：旋转 · 右键拖动：平移 · 滚轮：缩放<br />
      快捷键 R 重置视角 · 1-8 切换机位 · 空格 自动环绕
    </div>

    <button id="panel-toggle" title="显示 / 隐藏控制面板">☰</button>
    <div id="credit">PROCEDURAL MODEL · BUILT WITH THREE.JS</div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
